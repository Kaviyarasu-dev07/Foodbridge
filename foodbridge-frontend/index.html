<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
    <title>FoodBridge - Real-Time Food Rescue & Distribution</title>
    <script>
      // Apply theme before render to prevent FOUC
      (function() {
        var theme = localStorage.getItem('foodbridge_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();

      // Fix SockJS / STOMP ReferenceError: global is not defined in Vite
      window.global = window.globalThis || window;

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('Force-unregistered Service Worker from index.html');
          }
        });
      }
      if (window.caches) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('Deleted cache: ', name);
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
